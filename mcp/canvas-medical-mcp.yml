guardrails:
  note: >-
    Every tool above touches PHI on a per-customer instance. A real server would need the SMART scope
    model in scopes/canvas-medical-scopes.yml (patient/, user/, system/ contexts) enforced per call,
    and the agentic-access classification in agentic-access/canvas-medical-agentic-access.yml applied
    to the write operations. Do not treat this candidate list as an authorization design.
