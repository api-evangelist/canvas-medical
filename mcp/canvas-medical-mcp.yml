generated: '2026-08-14'
method: derived
status: candidate
source: openapi/canvas-medical-*-openapi.yml (27 refined FHIR R4 specs) + docs.canvasmedical.com/llms.txt
search_result: >-
  No Canvas Medical MCP server exists. Searched the docs (llms.txt indexes every page and names no MCP
  surface), the github.com/canvas-medical organization (38 repos, none an MCP server), npm and PyPI.
  Canvas has published its position explicitly: its CEO's post "Multi-Agent Systems Need More Than MCP
  to Work in Healthcare" (https://www.canvasmedical.com/articles/multiagent-coordination-with-mcp)
  argues MCP alone does not solve task orientation, identity, governance or state synchronization, and
  names the Canvas SDK — server-side plugins running inside the EMR — as the foundation layer instead.
  The tools below are therefore an API Evangelist candidate derived from the FHIR operations Canvas
  does publish, NOT a server Canvas ships.
deployment:
  mode: none
  auth: oauth
  verified: searched
  note: >-
    mode:none — nobody ships a server. No hosted endpoint and no stdio package exist, so no endpoint
    or install command is recorded. If Canvas ever ships one it will be per-customer-instance, since
    every customer runs an isolated instance with its own base URL and its own authorization server.
server:
  name: canvas-medical
  transport: null
  url: null
