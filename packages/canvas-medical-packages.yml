note: >-
  Canvas Medical's first-party client story is Python-first: one actively released package (`canvas`)
  carries both the server-side plugin SDK and the `canvas` CLI. The JavaScript packages are the
  patient-facing embed widgets, and they have not been republished since 2022. `canvas-sdk` on PyPI is
  a Canvas LMS client by an unrelated author and is deliberately NOT listed here.
