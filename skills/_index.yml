observation: >-
  Note what these skills are FOR. Every one of them targets building a Canvas plugin — code that runs
  inside the EMR — rather than calling the Canvas API from outside it. Two of the eleven
  (fhir-api-client-development, fhir-api-client-security) address the FHIR API, and both frame it as
  something a plugin calls. That is consistent with Canvas's published position that the SDK, not an
  external tool protocol, is its agent foundation layer.
