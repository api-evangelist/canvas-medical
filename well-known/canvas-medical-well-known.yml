  - path: /.well-known/ai-plugin.json
    status: 404
  - path: /.well-known/agent-card.json
    status: 404
  - path: /.well-known/agent.json
    status: 404
- host: https://apex.canvasmedical.com
  role: Canvas EHR instance + OAuth 2.0 authorization server
  documents:
  - path: /auth/.well-known/openid-configuration
    standard: OpenID Connect Discovery 1.0
    status: 200
    content_type: application/json
    file: canvas-medical-openid-configuration.json
  - path: /auth/.well-known/jwks.json
    standard: RFC 7517 JSON Web Key Set
    status: 200
    content_type: application/json
    file: null
    note: >-
      Served and verified (200, one RS256 signing key). Not stored in this repo — the key set rotates,
      so a captured copy would be stale data rather than a durable artifact.
  - path: /.well-known/openid-configuration
