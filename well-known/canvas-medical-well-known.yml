api_catalog:
  note: >-
    Canvas Medical does not serve /.well-known/api-catalog (RFC 9727), but it does publish the
    equivalent directory at a documented static location, as required by the ONC/ASTP HTI-1
    §170.315(g)(10) service base URL condition. Both files are FHIR R4 Bundles of Organization +
    Endpoint resources naming every customer FHIR base URL.
  documents:
  - url: https://docs.canvasmedical.com/assets/static/fhir-service-base-urls-production.json
    status: 200
    file: canvas-medical-fhir-service-base-urls-production.json
    endpoints: 76
    environment: production
  - url: https://docs.canvasmedical.com/assets/static/fhir-service-base-urls-nonproduction.json
    status: 200
    file: canvas-medical-fhir-service-base-urls-nonproduction.json
    environment: non-production
  docs: https://docs.canvasmedical.com/api/service-base-urls/
security_txt:
  served: false
  note: No /.well-known/security.txt on any Canvas Medical host; no SecurityTxt pointer is emitted.
agent_card:
  served: false
  note: >-
    No A2A agent card at /.well-known/agent-card.json or the legacy /.well-known/agent.json on any
    host. Nothing is written to a2a/ — an agent card is search-only and is never authored on a
    provider's behalf.
