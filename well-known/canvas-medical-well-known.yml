generated: '2026-08-14'
method: probed
source: live HTTP probes of every canvasmedical.com host named in apis.yml and the OpenAPI servers[] block
note: >-
  Canvas Medical runs one isolated instance per customer, so there is no single shared API host.
  The marketing host (www.canvasmedical.com), the docs host (docs.canvasmedical.com) and the status
  host all answer 404 (or an SPA/soft-404 HTML shell) on every /.well-known/ path. The real discovery
  surface lives on the per-customer FHIR host, https://fumage-<subdomain>.canvasmedical.com, and on
  its paired authorization server, https://<subdomain>.canvasmedical.com/auth/. Those were probed
  against fumage-apex.canvasmedical.com — a PRODUCTION endpoint taken from Canvas Medical's own
  published Service Base URLs directory, not a guessed host — and both return real documents.
hosts:
- host: https://fumage-apex.canvasmedical.com
  role: FHIR R4 service base (per-customer, representative production instance)
  documents:
  - path: /.well-known/smart-configuration
    standard: SMART App Launch 2.0 discovery
    status: 200
    content_type: application/json
    file: canvas-medical-smart-configuration.json
  - path: /.well-known/openid-configuration
    status: 404
  - path: /.well-known/oauth-authorization-server
    status: 404
  - path: /.well-known/security.txt
    status: 404
  - path: /.well-known/api-catalog
