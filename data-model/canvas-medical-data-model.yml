model: fhir-r4
description: >-
  The Canvas data model IS the FHIR R4 resource model — Canvas does not define its own object graph
  on the API surface. Relationships below were walked out of the OpenAPI schemas: every property whose
  schema is a FHIR `Reference` (or an array of them) is an edge. Patient is the hub; almost every
  clinical resource points at it through `subject` or `patient`, and Encounter is the secondary hub
  for anything that happened during a visit.
identifiers:
  patient_key:
    format: UUID without dashes
    note: Patient and staff keys are UUIDs with the dashes stripped.
  other_resources:
    format: standard dashed UUID
  source: https://docs.canvasmedical.com/llms.txt
  warning: >-
    The dashed/undashed split is per-resource-family, not per-request. Passing a dashed patient key,
    or an undashed key for a non-patient resource, is the most common 404 on this API.
