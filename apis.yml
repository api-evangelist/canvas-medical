- aid: canvas-medical:canvas-medical-sdk
  name: Canvas Medical SDK
  description: >-
    A Python SDK that enables developers to build plugins that execute natively within the Canvas EMR
    infrastructure. Supports an event-driven architecture with over 650 clinical and operational events,
    Django ORM database access, effects for modifying data and automating workflows, and pre-built integrations
    with AWS S3, LLMs, SendGrid, Twilio, and Extend AI.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.canvasmedical.com/sdk/
  baseURL: https://pypi.org/project/canvas/
