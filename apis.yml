apis:
- aid: canvas-medical:canvas-medical-fhir-api
  name: Canvas Medical FHIR API
  description: >-
    A FHIR R4-compliant REST API providing secure access to electronic health record data including 41
    FHIR resources (21 with write capabilities) covering clinical, administrative, financial, and care
    coordination domains. Supports OAuth 2.0 Client Credentials and Authorization Code flows with SMART
    on FHIR scopes for machine-to-machine and user-delegated access.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.canvasmedical.com/api/
  baseURL: https://fumage-{canvas-instance}.canvasmedical.com
  tags:
